<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aguitech Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10101a;color:#faf8ff;font:16px system-ui}main{max-width:1280px;margin:auto;padding:clamp(16px,4vw,48px)}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:clamp(38px,7vw,84px);letter-spacing:-.075em;margin:8px 0 22px}small{color:#a5ff83;letter-spacing:.2em}section{display:grid;grid-template-columns:230px 1fr;gap:20px}nav{display:grid;gap:6px;align-content:start}button,input{font:inherit}button{background:#24243a;color:white;border:1px solid #42425a;border-radius:9px;padding:9px 13px;cursor:pointer;text-align:left}button:hover,button[aria-current=true]{border-color:#a5ff83;color:#a5ff83}button:disabled{opacity:.5}button.primary{background:#a5ff83;color:#102018;font-weight:800}canvas{width:100%;display:block;border-radius:16px;background:#17172a;touch-action:none}h2{margin:0 0 6px}p{color:#c7c5d6;margin:0 0 14px}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:14px}input{width:72px;border:1px solid #555;background:#181825;color:white;padding:6px;border-radius:5px}#status{margin-top:10px}video{display:none}@media(max-width:720px){section{grid-template-columns:1fr}nav{grid-template-columns:repeat(2,1fr)}}
</style><main><header><small>AGUITECH STUDIO</small><small>10 EXPERIENCIAS INTERACTIVAS</small></header><h1>Aguitech Arcade</h1><section><nav aria-label="Juegos"></nav><article><h2 id="name"></h2><p id="hint"></p><canvas id="stage" width="960" height="540" aria-label="Área de juego"></canvas><div class="controls"><button class="primary" id="start">Jugar</button><button id="camera">Activar cámara</button><label>Duración <input id="seconds" type="number" min="15" max="180" value="45"> s</label></div><p id="status" role="status">Mueve el puntero o usa las flechas. Espacio equivale a un toque.</p></article></section><video muted playsinline></video></main><script type="module" src="./arcade.js"></script></html>
